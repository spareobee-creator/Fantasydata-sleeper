<script>

      const L=lu[o]=lu[o]||{a:0,p:0,n:0};L.a+=act;L.p+=opt;L.n++;

      blun.push([o,w,+act.toFixed(1),+opt.toFixed(1),bb,bb?+(pts[bb]||0).toFixed(1):0])})});

    Object.keys(wkc).forEach(o=>{wkc[o]=Object.entries(wkc[o]).sort((a,b)=>b[1][0]-a[1][0]||b[1][1]-a[1][1]).slice(0,20).map(([pid,e])=>[pid,e[0],+e[1].toFixed(1)])});
    Object.values(lu).forEach(l=>{l.a=+l.a.toFixed(1);l.p=+l.p.toFixed(1)});Object.values(ps).forEach(m=>Object.keys(m).forEach(k=>m[k]=+m[k].toFixed(1)));
    const wv={},wbest=[],wdrop=[];
    tr.forEach((a,i)=>a.forEach(t=>{if(t.status!=='complete'||(t.type!=='waiver'&&t.type!=='free_agent'))return;const bid=(t.settings&&t.settings.waiver_bid)||0;
      Object.entries(t.adds||{}).forEach(([pid,r])=>{const o=own[r];if(!o)return;const ws=Object.entries(pp[pid]||{}).filter(([w])=>+w>=i+1&&+w<pws),
        ros=ws.reduce((z,[,v])=>z+v,0),stp=ws.reduce((z,[w,v])=>z+((sp[pid]||{})[w]===r?v:0),0),e=wv[o]=wv[o]||{n:0,bid:0,stp:0};

}
const T=(o,k)=>o[k]=o[k]||{w:0,l:0,t:0,pf:0,pa:0};

const inBr=(s,o)=>Object.values(s.alive).some(a=>a.includes(o));

    const grp=(L,key)=>{const g={};L.forEach(d=>{const k=key(d);(g[k]=g[k]||[]).push(d)});return Object.values(g)},av=l=>l.reduce((a,d)=>a+d.n,0)/l.length,pl=d=>`${d.nm.trim()} (${d.pos})`,ss=l=>[...new Set(l.map(d=>d.s))].sort().join(', ');
    const upd=()=>{const m=$('M').value,q=$('Q').value.trim().toLowerCase(),F=m==='all'?P:P.filter(d=>d.o===m);let h='';
      if(q){const R=P.filter(d=>d.nm.toLowerCase().includes(q)).sort((a,b)=>a.s-b.s||a.n-b.n);
        h+='<h3>Search results</h3>'+(R.length?tbl(['Player','Season','Pick','Manager','Pts'],R.map(d=>[pl(d),d.s,`#${d.n} (Rd ${d.r})`,nm(d.o),f1(d.pts)])):'<p class="mut">No matches.</p>')}
      h+=`<h3>${m==='all'?'Same player, same manager (most times drafted)':'Most-drafted players by '+nm(m)}</h3>`+
        tbl(['Player','Manager','Times','Seasons','Avg pick'],grp(F,d=>m==='all'?d.pid+'|'+d.o:d.pid).filter(l=>l.length>1).sort((a,b)=>b.length-a.length||av(a)-av(b)).slice(0,15).map(l=>[pl(l[0]),nm(l[0].o),l.length,ss(l),f1(av(l))]));
      if(m==='all'){
        h+='<h3>Most-drafted players in the league</h3>'+tbl(['Player','Times drafted','Drafted most by','Avg pick'],grp(P,d=>d.pid).filter(l=>l.length>1).sort((a,b)=>b.length-a.length||av(a)-av(b)).slice(0,15).map(l=>{
          const t=grp(l,d=>d.o).sort((a,b)=>b.length-a.length)[0];return[pl(l[0]),l.length,`${nm(t[0].o)} (${t.length})`,f1(av(l))]}));
        h+='<h3>#1 overall picks</h3>'+tbl(['Season','Player','Manager','Pts'],P.filter(d=>d.n===1).sort((a,b)=>b.s-a.s).map(d=>[d.s,pl(d),nm(d.o),f1(d.pts)]));
        h+='<h3>Draft slot history (first-round pick number)</h3>'+tbl(['Manager','Avg slot','By season'],grp(P.filter(d=>d.r===1),d=>d.o).sort((a,b)=>av(a)-av(b)).map(l=>[nm(l[0].o),f1(av(l)),[...l].sort((a,b)=>a.s-b.s).map(d=>`${d.s}: ${d.n}`).join(' · ')]))}
      else h+='<h3>First-round picks</h3>'+tbl(['Season','Pick','Player','Pts'],F.filter(d=>d.r===1).sort((a,b)=>b.s-a.s).map(d=>[d.s,'#'+d.n,pl(d),f1(d.pts)]));
      $('dho').innerHTML=h};
    $('Q').oninput=upd;bind(upd,'M');
  }else if(tab==='pow'){
    const s=D.seasons[D.seasons.length-1],gs=s.games.filter(g=>!g.po&&g.a&&g.b),wks=[...new Set(gs.map(g=>g.week))].sort((a,b)=>a-b),last=wks.slice(-3),ws={},sp={},ap={};
    gs.forEach(g=>{[[g.a,g.pa,g.pb],[g.b,g.pb,g.pa]].forEach(([x,f,a])=>{const r=T(ws,x);f>a?r.w++:f<a?r.l++:r.t++;if(last.includes(g.week))(sp[x]=sp[x]||[]).push(f)})});
    wks.forEach(w=>{const l=[];gs.filter(g=>g.week===w).forEach(g=>l.push([g.a,g.pa],[g.b,g.pb]));l.forEach(([x,p],i)=>l.forEach(([y,q],k)=>{if(i!==k){const r=T(ap,x);p>q?r.w++:p<q?r.l++:r.t++}}))});
    const av=x=>(sp[x]||[]).reduce((a,b)=>a+b,0)/Math.max(1,(sp[x]||[]).length),mx=Math.max(...Object.keys(ws).map(av));
    const rk=Object.keys(ws).map(x=>[x,.4*wp(ap[x]||{w:0,l:0,t:0})+.3*wp(ws[x])+.3*av(x)/mx]).sort((a,b)=>b[1]-a[1]);
    o.innerHTML=`<p class="mut">${s.season} season: 40% all-play win%, 30% win%, 30% last-3-week scoring.</p>`+tbl(['#','Manager','Record','Last 3 avg','Score'],rk.map(([x,v],i)=>[i+1,nm(x),rec(ws[x]),f1(av(x)),(v*100).toFixed(1)]));
  }
}
const TABS=[['stand','Standings'],['h2h','Head-to-head'],['vs','Matchup'],['start','Season starts'],['fin','Finishes'],['po','Playoffs'],['miss','Missed out'],
  ['luck','Luck'],['lineup','Lineups'],['pos','Positions'],['wv','Waivers'],['dv','Draft value'],['ph','Players'],['sched','Schedule luck'],['wk','Weekly awards'],['clutch','Clutch'],['trend','Trends'],['awards','Awards'],['streak','Streaks'],['rec','Records'],['cons','Consistency'],['riv','Rivalries'],['bench','Bench'],['draft','Drafts'],['act','Activity'],['trade','Trades'],['pow','Power'],['dh','Draft history']];
const GROUPS=[['Overview',['stand','h2h','vs','fin','awards','start','riv']],['Playoffs & luck',['po','miss','luck','sched']],['Performance',['wk','clutch','trend','streak','rec','cons','pow']],['Rosters',['lineup','pos','bench','ph']],['Trades & drafts',['trade','act','wv','draft','dv','dh']]];
function show(){
  $('st').textContent=D.seasons.length+' seasons loaded ('+D.seasons.map(s=>s.season).join(', ')+')';$('snap').hidden=false;
  const L=Object.fromEntries(TABS);$('tabs').hidden=false;
  $('tabs').innerHTML='<select id="tabsel">'+GROUPS.map(([g,ks])=>`<optgroup label="${g}">${ks.map(k=>`<option value="${k}"${k===tab?' selected':''}>${L[k]}</option>`).join('')}</optgroup>`).join('')+'</select>';
  $('tabsel').onchange=e=>{tab=e.target.value;render()};
  render();
}
$('go').onclick=async()=>{try{D=await fetchAll($('lid').value.trim());show()}catch(e){$('st').textContent='Error: '+e.message}};
$('po').onchange=()=>D&&render();
$('snap').onclick=()=>{const h=ORIG.replace(/<script id="snapdata">[\s\S]*?<\/script>/,()=>'<script id="snapdata">window.SNAP='+JSON.stringify(D).replace(/</g,'\\u003c')+'<\/script>');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='sleeper-history-snapshot.html';a.click()};
if(window.SNAP){D=window.SNAP;$('ctl').querySelector('#lid').hidden=$('go').hidden=true;show()}
</script></body></html>
