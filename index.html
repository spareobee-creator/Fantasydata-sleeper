    const N=4000,pt=s.pt||6,po={},tp={},ew={};os.forEach(x=>{po[x]=0;tp[x]=0;ew[x]=0});
    const nr=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
    for(let n=0;n<N;n++){const w={...W},p={...PF};
      s.sch.forEach(([,a,b])=>{if(mu[a]==null||mu[b]==null)return;const x=mu[a]+sd[a]*nr(),y=mu[b]+sd[b]*nr();p[a]+=x;p[b]+=y;if(x>y)w[a]++;else w[b]++});
      [...os].sort((a,b)=>w[b]-w[a]||p[b]-p[a]).forEach((x,i)=>{if(i<pt)po[x]++;if(i===0)tp[x]++;ew[x]+=w[x]})}
    const wl=new Set(s.sch.map(q=>q[0])).size;
    o.innerHTML=`<p class="mut">${s.season}: ${N} simulations of the ${wl} remaining regular-season week${wl===1?'':'s'} using the real schedule. Each team's score is drawn from its own average and spread so far. Top ${pt} by wins, then points, make the playoffs (division tiebreakers ignored). Weeks in progress are not counted.</p>`+
      tbl(['Manager','Record','Avg pts','Playoff odds','#1 seed','Proj. wins'],[...os].sort((a,b)=>po[b]-po[a]||ew[b]-ew[a]).map(x=>{const pc=po[x]/N*100;
        return[nm(x),rec(R[x]),f1(mu[x]),`<span class="${pc>=50?'w':'l'}">${pc.toFixed(1)}%</span>`,(tp[x]/N*100).toFixed(1)+'%',f1(ew[x]/N)]}));mkSort();
  }else if(tab==='shame'){
    const pn=D.pn||{},M={},LG=[],B=[];
    D.seasons.forEach(z=>{z.games.forEach(g=>{if(g.po||!g.a||!g.b||g.oa==null||g.ob==null)return;
      [[g.a,g.pa,g.pb,g.oa,g.b],[g.b,g.pb,g.pa,g.ob,g.a]].forEach(([x,f,q,op,y])=>{const e=M[x]=M[x]||{l:0,c:0};if(f<q){e.l++;if(op>q){e.c++;LG.push({x,y,s:z.season,w:g.week,f,q,op})}}})});
      (z.blun||[]).forEach(b=>B.push([z.season,...b]))});
    if(!Object.keys(M).length){o.innerHTML='<p class="mut">No lineup data. Click Load to refresh (old snapshots won\'t have it).</p>';return}
    o.innerHTML='<p class="mut">Regular season only. "Cost a win" = lost the game but the best possible lineup from that week\'s roster would have beaten the opponent.</p>'+
      '<h3>Wins lost to bench decisions</h3>'+tbl(['Manager','Losses','Cost a win','% of losses'],Object.keys(M).sort((a,b)=>M[b].c-M[a].c).map(x=>[nm(x),M[x].l,`<span class="l">${M[x].c}</span>`,M[x].l?(M[x].c/M[x].l*100).toFixed(0)+'%':'-']))+
      '<h3>Most painful losses</h3>'+tbl(['Manager','When','Score','Opponent','Optimal','Optimal would have won by'],[...LG].sort((a,b)=>(b.op-b.q)-(a.op-a.q)).slice(0,10).map(g=>[nm(g.x),g.s+' W'+g.w,f1(g.f),`${nm(g.y)} (${f1(g.q)})`,f1(g.op),`<span class="l">${f1(g.op-g.q)}</span>`]))+
      '<h3>Worst lineup weeks (all-time)</h3>'+tbl(['Manager','When','Actual','Optimal','Lost','Top benched'],[...B].sort((a,b)=>(b[4]-b[3])-(a[4]-a[3])).slice(0,10).map(b=>[nm(b[1]),b[0]+' W'+b[2],f1(b[3]),f1(b[4]),`<span class="l">${f1(b[4]-b[3])}</span>`,b[5]?`${pn[b[5]]||b[5]} ${f1(b[6])}`:'-']));mkSort();
  }else if(tab==='pow'){
    const s=D.seasons[D.seasons.length-1],gs=s.games.filter(g=>!g.po&&g.a&&g.b),wks=[...new Set(gs.map(g=>g.week))].sort((a,b)=>a-b),last=wks.slice(-3),ws={},sp={},ap={};
    gs.forEach(g=>{[[g.a,g.pa,g.pb],[g.b,g.pb,g.pa]].forEach(([x,f,a])=>{const r=T(ws,x);f>a?r.w++:f<a?r.l++:r.t++;if(last.includes(g.week))(sp[x]=sp[x]||[]).push(f)})});
    wks.forEach(w=>{const l=[];gs.filter(g=>g.week===w).forEach(g=>l.push([g.a,g.pa],[g.b,g.pb]));l.forEach(([x,p],i)=>l.forEach(([y,q],k)=>{if(i!==k){const r=T(ap,x);p>q?r.w++:p<q?r.l++:r.t++}}))});
    const av=x=>(sp[x]||[]).reduce((a,b)=>a+b,0)/Math.max(1,(sp[x]||[]).length),mx=Math.max(...Object.keys(ws).map(av));
    const rk=Object.keys(ws).map(x=>[x,.4*wp(ap[x]||{w:0,l:0,t:0})+.3*wp(ws[x])+.3*av(x)/mx]).sort((a,b)=>b[1]-a[1]);
    o.innerHTML=`<p class="mut">${s.season} season: 40% all-play win%, 30% win%, 30% last-3-week scoring.</p>`+tbl(['#','Manager','Record','Last 3 avg','Score'],rk.map(([x,v],i)=>[i+1,nm(x),rec(ws[x]),f1(av(x)),(v*100).toFixed(1)]));
  }
}
const TABS=[['stand','Standings'],['h2h','Head-to-head'],['vs','Matchup'],['start','Season starts'],['fin','Finishes'],['po','Playoffs'],['miss','Missed out'],
['lineup','Lineups'],['pos','Positions'],['wv','Waivers'],['dv','Draft value'],['ph','Players'],['sched','Schedule luck'],['wk','Weekly awards'],['clutch','Clutch'],['trend','Trends'],['awards','Awards'],['streak','Streaks'],['rec','Records'],['cons','Consistency'],['riv','Rivalries'],['draft','Drafts'],['act','Activity'],['trade','Trades'],['pledger','Pick trades'],['tm','Trade partners'],['div','Divisions'],['prof','Manager profile'],['odds','Playoff odds'],['shame','Hall of shame'],['pow','Power'],['dh','Draft history']];
const GROUPS=[['Overview',['prof','stand','div','h2h','vs','fin','awards','start','riv']],['Playoffs & luck',['po','miss','odds','sched','shame']],['Performance',['wk','clutch','trend','streak','rec','cons','pow']],['Rosters',['lineup','pos','ph']],['Trades & drafts',['trade','pledger','tm','act','wv','draft','dv','dh']]];
function show(){
  $('st').textContent=D.seasons.length+' seasons loaded ('+D.seasons.map(s=>s.season).join(', ')+')'+((D.seasons[D.seasons.length-1]||{}).cut<99?' · week '+D.seasons[D.seasons.length-1].cut+' onward excluded (in progress)':'');$('snap').hidden=false;$('csv').hidden=false;
  const L=Object.fromEntries(TABS);$('tabs').hidden=false;
  $('tabs').innerHTML='<select id="tabsel">'+GROUPS.map(([g,ks])=>`<optgroup label="${g}">${ks.map(k=>`<option value="${k}"${k===tab?' selected':''}>${L[k]}</option>`).join('')}</optgroup>`).join('')+'</select>';
  $('tabsel').onchange=e=>{tab=e.target.value;render()};
  render();
}
$('go').onclick=async()=>{try{D=await fetchAll($('lid').value.trim());show()}catch(e){$('st').textContent='Error: '+e.message}};
$('po').onchange=()=>D&&render();
$('csv').onclick=()=>{const q=v=>'"'+String(v).replace(/\s+/g,' ').trim().replace(/"/g,'""')+'"',out=[];
  document.querySelectorAll('#out table').forEach(t=>{let h=t.closest('.wrap');h=h&&h.previousElementSibling;while(h&&h.tagName!=='H3'&&h.previousElementSibling&&!/^H3$/.test(h.tagName))h=null;
    if(h&&h.tagName==='H3')out.push(q(h.textContent));[...t.rows].forEach(r=>out.push([...r.cells].map(c=>q(c.textContent)).join(',')));out.push('')});
  if(!out.length)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+out.join('\n')],{type:'text/csv'}));a.download='sleeper-'+tab+'.csv';a.click()};
$('snap').onclick=()=>{const h=ORIG.replace(/<script id="snapdata">[\s\S]*?<\/script>/,()=>'<script id="snapdata">window.SNAP='+JSON.stringify(D).replace(/</g,'\\u003c')+'<\/script>');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='sleeper-history-snapshot.html';a.click()};
if(window.SNAP){D=window.SNAP;$('ctl').querySelector('#lid').hidden=$('go').hidden=true;show()}
</script></body></html>
